name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.Deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Roblox stats
        continue-on-error: true
        run: node scripts/FetchStats.mjs data/Stats.json

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html tracker.html Commissions.json css js data media _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: Deployment
        uses: actions/deploy-pages@v4
