<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="OASIS - Roblox developer. Scripting, VFX, UI and SFX for combat games.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data: https://cdn.discordapp.com; media-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://api.lanyard.rest;">
<title>OASIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800;900&family=Saira:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/Base.css">
<link rel="stylesheet" href="css/Menu.css">
<link rel="stylesheet" href="css/Screens.css">
<link rel="stylesheet" href="css/Player.css">
</head>
<body>

<div class="Backdrop" aria-hidden="true">
<div class="Caustic"></div>
<div class="Streak"></div>
<div class="Streak StreakTwo"></div>
</div>

<header class="Hud" aria-hidden="true">
<div class="HudDate" id="HudDate"></div>
<div class="HudTime" id="HudTime"></div>
</header>

<a class="Presence" id="Presence" href="https://discord.com/users/890630436840173579" target="_blank" rel="noopener noreferrer">
<img class="PresenceAvatar" id="PresenceAvatar" alt="" hidden>
<span class="PresenceText">
<span class="PresenceName" id="PresenceName">DISCORD</span>
<span class="PresenceStatus"><i class="PresenceDot" id="PresenceDot"></i><span id="PresenceLabel">OPEN FOR WORK</span></span>
</span>
</a>

<section class="Title" id="Title" aria-label="Title screen">
<h1 class="TitleName">OASIS</h1>
<p class="TitleRole">SCRIPTER / VFX / UI / SFX</p>
<button class="TitlePrompt" id="TitlePrompt">PRESS ANY KEY / TAP TO START</button>
</section>

<main>
<section class="Screen" id="ScreenMain" data-screen="Main" aria-label="Main menu"></section>
<section class="Screen" id="ScreenWorks" data-screen="Works" aria-label="Works"></section>
<section class="Screen" id="ScreenGames" data-screen="Games" aria-label="Games"></section>
<section class="Screen" id="ScreenCommissions" data-screen="Commissions" aria-label="Commissions"></section>
<section class="Screen" id="ScreenLatest" data-screen="Latest" aria-label="Latest"></section>
<section class="Screen" id="ScreenContact" data-screen="Contact" aria-label="Contact"></section>
</main>

<button class="BackButton" id="BackButton" hidden><b>ESC</b>BACK</button>

<div class="Player" id="Player"></div>

<div class="Wipe" id="Wipe" aria-hidden="true">
<div class="WipeBar"></div>
<div class="WipeBar WipeBarCyan"></div>
</div>

<script type="module" src="js/Main.js"></script>
</body>
</html>
